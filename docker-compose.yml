# Run on a server / NAS:  docker compose up -d --build
# With 2 GB uploads:      docker compose --profile bigfiles up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DOWNLOAD_DIR: /downloads
      SETTINGS_FILE: /downloads/.bot_settings.json
    volumes:
      - ./downloads:/downloads
      - ./rclone:/root/.config/rclone

  # Local Telegram Bot API server: lifts the upload limit from 50 MB to 2 GB.
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org
  # and TELEGRAM_API_URL=http://telegram-bot-api:8081 in .env.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["bigfiles"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
